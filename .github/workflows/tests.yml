name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-bot:
    strategy:
      matrix:
        # Intel macOS runner coverage is retired for this tap. Formulae that
        # still publish darwin-amd64 assets remain installable, but CI covers
        # Linux and the current macOS hosted runner baseline.
        os: [ ubuntu-24.04, macos-latest ]
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      # Homebrew gates third-party taps behind tap trust; an untrusted tap
      # fails `brew doctor` inside `test-bot --only-setup`.
      - name: Trust this tap
        run: brew trust 3leaps/tap

      - name: Clean Homebrew core tap
        run: |
          CORE_TAP="$(brew --repository homebrew/core)"
          if [ -d "$CORE_TAP" ]; then
            echo "Cleaning homebrew-core at $CORE_TAP"
            git -C "$CORE_TAP" reset --hard HEAD
            git -C "$CORE_TAP" clean -fd
          else
            echo "homebrew-core not present at $CORE_TAP (fresh environment)"
          fi

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      # The updater refuses unsigned or mis-signed checksums; its tests sign
      # fixtures with throwaway minisign keys.
      - name: Updater tests
        run: |
          brew install minisign
          PATH="$(dirname "$(brew ruby -e 'print RbConfig.ruby')"):$PATH" \
            bash "$(brew --repository 3leaps/tap)/tests/update-formula_test.sh"

      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
